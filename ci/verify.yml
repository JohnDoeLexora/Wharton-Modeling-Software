name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck, tests, parity, stats, and the walkthrough
        run: npm run verify
      - name: Coverage of the finance core
        run: npm run coverage
      - name: Performance budget
        run: npm run perf
      - name: Methods PDF
        run: npm run paper
